name: Generate verified lab previews
on:
  push:
    branches: [fix/ce235-labs-document-availability]
    paths: [documentation/labs-availability/generate.py]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ce235-labs-document-availability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.26.5 Pillow==11.3.0
      - run: python documentation/labs-availability/generate.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/public/assets/WebP/list-* code/src/data/labPdfPreviews.ts code/src/data/labDocuments.ts documentation/labs-availability/previews.json
          git diff --cached --quiet || git commit -m 'assets(labs): generate verified WebP previews and PDF annotations'
          git push origin HEAD:fix/ce235-labs-document-availability

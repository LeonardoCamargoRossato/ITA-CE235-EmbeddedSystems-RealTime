name: Validate CE-235 PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sprint3-publication:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify Sprint 3 publication assets
        run: |
          for slug in diagrama-us330 portal-us330 kanban-sprint3 ground-station-api-componentes; do
            test -s "dist/assets/PNG/sprint-3/us330/$slug.png"
            test -s "dist/assets/WebP/sprint-3/us330/$slug.webp"
          done
          test -s dist/assets/SVG/sprint-3/us330/ground-station-api-componentes.svg
          test -s dist/assets/PDF/sprint-3/us330/Relatorio_Pessoal_US330_Sprint3_Leonardo_Rossato.pdf
          grep -q 'path="/list5"' src/App.tsx
          grep -q 'id:"list5"' src/data/lists.ts
      - name: Install browser QA dependency without changing lockfile
        run: npm install --no-save --package-lock=false --prefix /tmp/ce235-browser-qa playwright@1.56.1 && ln -s /tmp/ce235-browser-qa/node_modules/playwright node_modules/playwright
      - name: Install Chromium
        run: node /tmp/ce235-browser-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ce235-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ITA-CE235-EmbeddedSystems-RealTime/ > /dev/null && break
            sleep 1
          done
          node scripts/sprint3-smoke.mjs
          node scripts/final-report-smoke.mjs
      - name: Build approved baseline for visual regression
        run: |
          git fetch --no-tags origin 57761cd591c9df35fbcc5a7cbe09d1dab8a16970
          git worktree add --detach /tmp/ce235-approved 57761cd591c9df35fbcc5a7cbe09d1dab8a16970
          ln -s "$GITHUB_WORKSPACE/code/node_modules" /tmp/ce235-approved/code/node_modules
          cd /tmp/ce235-approved/code
          test "$(git rev-parse HEAD)" = 57761cd591c9df35fbcc5a7cbe09d1dab8a16970
          grep -q "US123 — Telemetry Decoder" src/components/ContributionCard.tsx
          node "$GITHUB_WORKSPACE/code/node_modules/typescript/bin/tsc" -b
          node "$GITHUB_WORKSPACE/code/node_modules/vite/bin/vite.js" build /tmp/ce235-approved/code --config /tmp/ce235-approved/code/vite.config.ts --outDir /tmp/ce235-baseline-dist
          grep -rq "Portal de acesso US123 (Telemetry Decoder versão 1)" /tmp/ce235-baseline-dist/assets
          ! grep -rq "Portal de acesso Ground Station API V1" /tmp/ce235-baseline-dist/assets
          mkdir -p /tmp/ce235-baseline-http
          ln -s /tmp/ce235-baseline-dist /tmp/ce235-baseline-http/ITA-CE235-EmbeddedSystems-RealTime
      - name: Team contexts and baseline regression
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ce235-context-preview.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/ce235-baseline-http > /tmp/ce235-baseline-preview.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..30}; do
              curl -fsS "http://127.0.0.1:$port/ITA-CE235-EmbeddedSystems-RealTime/" > /dev/null && break
              sleep 1
            done
          done
          node scripts/team-context-smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint3-browser-qa
          path: |
            code/qa-sprint3/
            code/qa-final-report/
          if-no-files-found: warn

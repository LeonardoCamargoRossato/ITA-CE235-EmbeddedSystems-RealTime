name: Validate CE-235 PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sprint3-publication:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify Sprint 3 publication assets
        run: |
          for slug in diagrama-us330 portal-us330 kanban-sprint3; do
            test -s "dist/assets/PNG/sprint-3/us330/$slug.png"
            test -s "dist/assets/WebP/sprint-3/us330/$slug.webp"
          done
          test -s dist/assets/PDF/sprint-3/us330/Relatorio_Pessoal_US330_Sprint3_Leonardo_Rossato.pdf
          grep -q 'path="/list5"' src/App.tsx
          grep -q 'id:"list5"' src/data/lists.ts
      - name: Install browser QA dependency without changing lockfile
        run: npm install --no-save --package-lock=false --prefix /tmp/ce235-browser-qa playwright@1.56.1 && ln -s /tmp/ce235-browser-qa/node_modules/playwright node_modules/playwright
      - name: Install Chromium
        run: node /tmp/ce235-browser-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Browser smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ce235-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ITA-CE235-EmbeddedSystems-RealTime/ > /dev/null && break
            sleep 1
          done
          node scripts/sprint3-smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint3-browser-qa
          path: code/qa-sprint3/
          if-no-files-found: warn
